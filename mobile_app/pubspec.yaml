name: octo7_app
description: OCTO7 India Official Member App
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  supabase_flutter: ^2.8.0
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.1.2
  image_cropper: ^7.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/OCTO7_emblem_transparent-2.png

flutter_launcher_icons:
  image_path: "assets/images/OCTO7_emblem_transparent-2.png"
  android: true
  ios: false

flutter_native_splash:
  color: "#0F5127"
  image: "assets/images/OCTO7_emblem_transparent-2.png"
  color_dark: "#0F5127"
  android_12:
    color: "#0F5127"
    image: "assets/images/OCTO7_emblem_transparent-2.png"
  web: false
