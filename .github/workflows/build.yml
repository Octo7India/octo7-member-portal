name: Build OCTO7 Android APK

on:
  push:
    branches: [ main, 'feature/supabase-mobile-integration' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Platform Files
        run: flutter create --platforms=android .
        working-directory: ./mobile_app

      - name: Ensure Android release internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in content:
              end = content.find('>', content.find('<manifest'))
              if end < 0:
                  raise SystemExit("Could not locate Android manifest opening tag")
              content = content[:end + 1] + "\\n    " + permission + content[end + 1:]
              manifest.write_text(content)
          if permission not in manifest.read_text():
              raise SystemExit("Android INTERNET permission was not added")
          print("Verified INTERNET permission in main Android manifest")
          PY
        working-directory: ./mobile_app

      - name: Install Dependencies
        run: flutter pub get
        working-directory: ./mobile_app

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses

      - name: Build ARM64 Release APK
        env:
          SUPABASE_URL: https://oqggzpbxrlglsqzdkbpy.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
        working-directory: ./mobile_app

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: octo7-release-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
