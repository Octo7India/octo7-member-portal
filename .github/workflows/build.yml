name: Build OCTO7 Android APK

on:
  push:
    branches: [ main, 'feature/supabase-mobile-integration' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Platform Files
        run: flutter create --platforms=android .
        working-directory: ./mobile_app

      - name: Configure Android Gradle for image cropping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("Generated Android app Gradle file not found")
          content = gradle.read_text()

          # Preserve the generated applicationId, and make namespace match it.
          app_match = re.search(r'applicationId\s*(?:=\s*)?["\']([^"\']+)["\']', content)
          app_id = app_match.group(1) if app_match else "com.octo7.memberportal"
          if re.search(r'namespace\s*(?:=\s*)?["\'][^"\']+["\']', content):
              content = re.sub(r'namespace\s*(?:=\s*)?["\'][^"\']+["\']',
                               lambda m: re.sub(r'["\'][^"\']+["\']', '"' + app_id + '"', m.group(0)),
                               content, count=1)
          elif gradle.suffix == ".kts":
              content = re.sub(r'android\s*\{', 'android {\n    namespace = "' + app_id + '"', content, count=1)
          else:
              content = re.sub(r'android\s*\{', 'android {\n    namespace "' + app_id + '"', content, count=1)

          if gradle.suffix == ".kts":
              content, n = re.subn(r'minSdk\s*=\s*[^\n]+', 'minSdk = 21', content, count=1)
              if n == 0:
                  content = re.sub(r'defaultConfig\s*\{', 'defaultConfig {\n        minSdk = 21', content, count=1)
          else:
              content, n = re.subn(r'minSdkVersion\s+[^\n]+', 'minSdkVersion 21', content, count=1)
              if n == 0:
                  content = re.sub(r'defaultConfig\s*\{', 'defaultConfig {\n        minSdkVersion 21', content, count=1)

          if not re.search(r'minSdk(?:Version)?\s*(?:=)?\s*21', content):
              raise SystemExit("Failed to enforce Android minSdk 21")

          # Flutter's generated Android release lint currently crashes inside
          # CommentDetector/JavaDocParser. Keep normal compilation and packaging,
          # but prevent this broken release-only lint preflight from blocking APKs.
          if gradle.suffix == ".kts":
              lint_block = """\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n"""
          else:
              lint_block = """\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n"""
          if re.search(r'\blint\s*\{', content) is None:
              content = content.replace("android {", "android {" + lint_block, 1)
          if re.search(r'checkReleaseBuilds\s*(?:=)?\s*false', content) is None:
              raise SystemExit("Failed to disable crashing release lint preflight")
          gradle.write_text(content)

          props = Path("android/gradle.properties")
          props.parent.mkdir(parents=True, exist_ok=True)
          existing = props.read_text() if props.exists() else ""
          for key in ("android.useAndroidX=true", "android.enableJetifier=true"):
              existing = re.sub(r"^" + re.escape(key.split("=")[0]) + r"=.*$", key, existing, flags=re.M)
              if key.split("=")[0] not in existing:
                  existing += ("\n" if existing and not existing.endswith("\n") else "") + key + "\n"
          props.write_text(existing)
          print(f"Configured {gradle}: namespace={app_id}, minSdk=21")
          print("Verified AndroidX and Jetifier flags")
          PY
        working-directory: ./mobile_app

      - name: Configure permanent OCTO7 release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Missing KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD secret"; exit 1; }
          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          keytool -list -keystore android/app/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias upload >/dev/null
          python3 - <<'PY'
          from pathlib import Path

          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("Generated Android app Gradle file not found for signing")

          if gradle.suffix == ".kts":
              block = """
          val octo7KeyPassword = System.getenv("KEY_PASSWORD") ?: error("KEY_PASSWORD is missing")
          val octo7StorePassword = System.getenv("KEYSTORE_PASSWORD") ?: error("KEYSTORE_PASSWORD is missing")
          android {
              signingConfigs {
                  create("octo7Release") {
                      keyAlias = "upload"
                      keyPassword = octo7KeyPassword
                      storeFile = file("upload-keystore.jks")
                      storePassword = octo7StorePassword
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("octo7Release")
                  }
              }
          }
          """
          else:
              block = """
          def octo7KeyPassword = System.getenv("KEY_PASSWORD")
          def octo7StorePassword = System.getenv("KEYSTORE_PASSWORD")
          if (!octo7KeyPassword || !octo7StorePassword) {
              throw new GradleException("OCTO7 release signing secrets are missing")
          }
          android {
              signingConfigs {
                  octo7Release {
                      keyAlias 'upload'
                      keyPassword octo7KeyPassword
                      storeFile file('upload-keystore.jks')
                      storePassword octo7StorePassword
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.octo7Release
                  }
              }
          }
          """
          content = gradle.read_text()
          if "octo7Release" in content:
              raise SystemExit("OCTO7 signing block already exists; refusing duplicate configuration")
          gradle.write_text(content.rstrip() + "\n" + block)
          print(f"Configured permanent OCTO7 signing in {gradle}")
          PY
        working-directory: ./mobile_app

      - name: Set OCTO7 app name and generate company launcher icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          import re
          content, count = re.subn(r'android:label="[^"]*"', 'android:label="OCTO7"', content, count=1)
          if count == 0:
              content = content.replace('<application', '<application android:label="OCTO7"', 1)
          manifest.write_text(content)
          print("Android launcher label set to OCTO7")
          PY
          dart run flutter_launcher_icons
        working-directory: ./mobile_app

      - name: Ensure Android release internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in content:
              end = content.find('>', content.find('<manifest'))
              if end < 0:
                  raise SystemExit("Could not locate Android manifest opening tag")
              content = content[:end + 1] + "\\n    " + permission + content[end + 1:]
              manifest.write_text(content)
          if permission not in manifest.read_text():
              raise SystemExit("Android INTERNET permission was not added")
          print("Verified INTERNET permission in main Android manifest")
          PY
        working-directory: ./mobile_app

      - name: Install Dependencies
        run: flutter pub get
        working-directory: ./mobile_app

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses

      - name: Build ARM64 Release APK
        env:
          SUPABASE_URL: https://oqggzpbxrlglsqzdkbpy.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
        working-directory: ./mobile_app

      - name: Verify OCTO7 APK signature and certificate
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -x "$APKSIGNER" || { echo "Android apksigner tool not found"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/octo7-apk-signature.txt
          APK_CERT="$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/octo7-apk-signature.txt | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          KEY_CERT="$(keytool -list -v -keystore android/app/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias upload 2>/dev/null | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$APK_CERT" && test -n "$KEY_CERT" || { echo "Could not read APK or keystore certificate fingerprint"; exit 1; }
          test "$APK_CERT" = "$KEY_CERT" || { echo "APK signer does not match the permanent OCTO7 keystore"; exit 1; }
          echo "Verified: APK is signed by the permanent OCTO7 upload key."
        working-directory: ./mobile_app

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: octo7-release-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
