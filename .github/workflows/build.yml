name: Build OCTO7 Android APK

on:
  push:
    branches: [ main, 'feature/supabase-mobile-integration' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Platform Files
        run: flutter create --platforms=android .
        working-directory: ./mobile_app

      - name: Configure Android Gradle for image cropping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("Generated Android app Gradle file not found")
          content = gradle.read_text()

          # Preserve the generated applicationId, and make namespace match it.
          app_match = re.search(r'applicationId\s*(?:=\s*)?["\']([^"\']+)["\']', content)
          app_id = app_match.group(1) if app_match else "com.octo7.memberportal"
          if re.search(r'namespace\s*(?:=\s*)?["\'][^"\']+["\']', content):
              content = re.sub(r'namespace\s*(?:=\s*)?["\'][^"\']+["\']',
                               lambda m: re.sub(r'["\'][^"\']+["\']', '"' + app_id + '"', m.group(0)),
                               content, count=1)
          elif gradle.suffix == ".kts":
              content = re.sub(r'android\s*\{', 'android {\n    namespace = "' + app_id + '"', content, count=1)
          else:
              content = re.sub(r'android\s*\{', 'android {\n    namespace "' + app_id + '"', content, count=1)

          if gradle.suffix == ".kts":
              content, n = re.subn(r'minSdk\s*=\s*[^\n]+', 'minSdk = 21', content, count=1)
              if n == 0:
                  content = re.sub(r'defaultConfig\s*\{', 'defaultConfig {\n        minSdk = 21', content, count=1)
          else:
              content, n = re.subn(r'minSdkVersion\s+[^\n]+', 'minSdkVersion 21', content, count=1)
              if n == 0:
                  content = re.sub(r'defaultConfig\s*\{', 'defaultConfig {\n        minSdkVersion 21', content, count=1)

          if not re.search(r'minSdk(?:Version)?\s*(?:=)?\s*21', content):
              raise SystemExit("Failed to enforce Android minSdk 21")

          # Flutter's generated Android release lint currently crashes inside
          # CommentDetector/JavaDocParser. Keep normal compilation and packaging,
          # but prevent this broken release-only lint preflight from blocking APKs.
          if gradle.suffix == ".kts":
              lint_block = """\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n"""
          else:
              lint_block = """\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n"""
          if re.search(r'\blint\s*\{', content) is None:
              content = content.replace("android {", "android {" + lint_block, 1)
          if re.search(r'checkReleaseBuilds\s*(?:=)?\s*false', content) is None:
              raise SystemExit("Failed to disable crashing release lint preflight")
          gradle.write_text(content)

          props = Path("android/gradle.properties")
          props.parent.mkdir(parents=True, exist_ok=True)
          existing = props.read_text() if props.exists() else ""
          for key in ("android.useAndroidX=true", "android.enableJetifier=true"):
              existing = re.sub(r"^" + re.escape(key.split("=")[0]) + r"=.*$", key, existing, flags=re.M)
              if key.split("=")[0] not in existing:
                  existing += ("\n" if existing and not existing.endswith("\n") else "") + key + "\n"
          props.write_text(existing)
          print(f"Configured {gradle}: namespace={app_id}, minSdk=21")
          print("Verified AndroidX and Jetifier flags")
          PY
        working-directory: ./mobile_app

      - name: Set OCTO7 app name and generate company launcher icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          import re
          content, count = re.subn(r'android:label="[^"]*"', 'android:label="OCTO7"', content, count=1)
          if count == 0:
              content = content.replace('<application', '<application android:label="OCTO7"', 1)
          manifest.write_text(content)
          print("Android launcher label set to OCTO7")
          PY
          dart run flutter_launcher_icons
        working-directory: ./mobile_app

      - name: Ensure Android release internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in content:
              end = content.find('>', content.find('<manifest'))
              if end < 0:
                  raise SystemExit("Could not locate Android manifest opening tag")
              content = content[:end + 1] + "\\n    " + permission + content[end + 1:]
              manifest.write_text(content)
          if permission not in manifest.read_text():
              raise SystemExit("Android INTERNET permission was not added")
          print("Verified INTERNET permission in main Android manifest")
          PY
        working-directory: ./mobile_app

      - name: Install Dependencies
        run: flutter pub get
        working-directory: ./mobile_app

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses

      - name: Build ARM64 Release APK
        env:
          SUPABASE_URL: https://oqggzpbxrlglsqzdkbpy.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
        working-directory: ./mobile_app

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: octo7-release-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
