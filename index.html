<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>OCTO7 India | Member Portal</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  text-align: center;
}

.container {
  max-width: 430px;
  margin: 40px auto;
  padding: 20px;
}

h1 {
  color: #e5bd68;
  font-size: 36px;
}

.card, #dashboard {
  background: #1c293b;
  padding: 25px;
  border-radius: 15px;
}

input {
  width: 95%;
  padding: 13px;
  margin: 9px 0;
  border: 1px solid #777;
  border-radius: 7px;
}

button {
  width: 95%;
  padding: 13px;
  margin: 8px 0;
  background: #d6ad55;
  border: none;
  border-radius: 7px;
  font-weight: bold;
  cursor: pointer;
}

#message {
  color: #e5bd68;
  overflow-wrap: anywhere;
}

#dashboard {
  display: none;
  max-width: 750px;
  margin: 25px auto;
  padding: 20px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin: 20px 0;
}

.stat-box {
  background: #101827;
  padding: 18px 8px;
  border-radius: 10px;
  border: 1px solid #d6ad55;
}

.stat-box h2 {
  color: #e5bd68;
  margin: 8px;
}

#binaryTree {
  text-align: left;
  padding: 15px;
  overflow-x: auto;
}

.tree-node {
  margin: 10px 0 10px 15px;
  padding: 12px;
  background: #101827;
  border-left: 3px solid #d6ad55;
  border-radius: 7px;
}

.tree-node strong {
  color: #e5bd68;
}

.small {
  color: #ccc;
  font-size: 13px;
}

</style>
</head>

<body>

<div class="container" id="loginSection">

  <h1>OCTO7 India</h1>
  <p>MEMBER PORTAL</p>

  <div class="card">

    <h2>Welcome Back</h2>

    <h3>New Member Registration</h3>

    <input id="fullName" placeholder="Full Name">

    <input id="phone" type="tel" placeholder="Phone Number">

    <input id="sponsorId" placeholder="Sponsor Member ID">

    <input id="email" type="email" placeholder="Email Address">

    <input id="password" type="password" placeholder="Password">

    <button onclick="register()">CREATE ACCOUNT</button>

    <hr>

    <h3>Existing Member Login</h3>

    <button onclick="login()">MEMBER LOGIN</button>

    <p id="message">Welcome to OCTO7 India</p>

  </div>
</div>


<div id="dashboard">

  <h1>OCTO7 India</h1>

  <h2>MEMBER DASHBOARD</h2>

  <p id="memberEmail"></p>

  <p id="memberName"></p>

  <p id="memberCode"></p>

  <hr>

  <h2>MY TEAM PERFORMANCE</h2>

  <div class="stats">

    <div class="stat-box">
      <p>LEFT TEAM</p>
      <h2 id="leftCount">0</h2>
    </div>

    <div class="stat-box">
      <p>RIGHT TEAM</p>
      <h2 id="rightCount">0</h2>
    </div>

    <div class="stat-box">
      <p>TOTAL DOWNLINE</p>
      <h2 id="totalCount">0</h2>
    </div>

    <div class="stat-box">
      <p>MY LEVEL</p>
      <h2>0</h2>
    </div>

  </div>

  <hr>

  <h2>MY BINARY GENEALOGY</h2>

  <div id="binaryTree">
    Loading genealogy...
  </div>

  <p id="genealogyMessage"></p>

  <hr>

  <button onclick="loadGenealogy()">REFRESH GENEALOGY</button>

  <button onclick="logout()">LOG OUT</button>

</div>


<script>

const SUPABASE_URL =
"https://oqggzpbxrlglsqzdkbpy.supabase.co";

const SUPABASE_KEY =
"sb_publishable_yz9i0uLvJVzElz7IhEMyyw_WQj8hDc0";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


function showDashboard(user) {

  document.getElementById("loginSection").style.display = "none";

  document.getElementById("dashboard").style.display = "block";

  document.getElementById("memberEmail").textContent =
    "Email: " + user.email;

  loadGenealogy();

}


function showLogin() {

  document.getElementById("dashboard").style.display = "none";

  document.getElementById("loginSection").style.display = "block";

}


async function register() {

  const fullName =
    document.getElementById("fullName").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const sponsorId =
    document.getElementById("sponsorId").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("message");

  if (!fullName || !phone || !sponsorId || !email || !password) {

    message.textContent = "Please complete all fields.";

    return;

  }

  if (password.length < 6) {

    message.textContent = "Password must contain at least 6 characters.";

    return;

  }

  message.textContent = "Creating account...";

  try {

    const { data, error } = await client.auth.signUp({

      email: email,

      password: password,

      options: {

        emailRedirectTo:
          "https://octo7india.github.io/octo7-member-portal/",

        data: {

          full_name: fullName,

          phone: phone,

          sponsor_id: sponsorId

        }

      }

    });

    if (error) {

      message.textContent = error.message;

      return;

    }

    if (data.session) {

      showDashboard(data.user);

    } else {

      message.textContent =
        "Registration successful. Please confirm your email and login.";

    }

  } catch (error) {

    message.textContent = error.message;

  }

}


async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("message");

  if (!email || !password) {

    message.textContent = "Enter email and password.";

    return;

  }

  message.textContent = "Logging in...";

  try {

    const { data, error } =
      await client.auth.signInWithPassword({

        email: email,

        password: password

      });

    if (error) {

      message.textContent = error.message;

      return;

    }

    showDashboard(data.user);

  } catch (error) {

    message.textContent = error.message;

  }

}


async function loadGenealogy() {

  const tree =
    document.getElementById("binaryTree");

  const message =
    document.getElementById("genealogyMessage");

  tree.textContent = "Loading genealogy...";

  message.textContent = "";

  const { data, error } =
    await client.rpc("get_my_genealogy");

  if (error) {

    tree.textContent = "Genealogy error: " + error.message;

    return;

  }

  if (!data || data.length === 0) {

    tree.textContent =
      "Member record not found. Please contact administrator.";

    return;

  }

  const root = data.find(member => Number(member.depth) === 0);

  if (!root) {

    tree.textContent = "Root member not found.";

    return;

  }

  const children = data.filter(
    member => member.placement_parent_id !== null
  );

  const leftCount = children.filter(
    member => member.depth === 1 &&
    member.placement_side === "left"
  ).length;

  const rightCount = children.filter(
    member => member.depth === 1 &&
    member.placement_side === "right"
  ).length;

  document.getElementById("leftCount").textContent =
    leftCount;

  document.getElementById("rightCount").textContent =
    rightCount;

  document.getElementById("totalCount").textContent =
    data.length - 1;

  document.getElementById("memberName").textContent =
    "Member: " + (root.full_name || "");

  document.getElementById("memberCode").textContent =
    "Member ID: " + (root.member_id || "");

  tree.replaceChildren();

  const sorted = [...data].sort(
    (a, b) => a.depth - b.depth
  );

  sorted.forEach(member => {

    const node = document.createElement("div");

    node.className = "tree-node";

    node.style.marginLeft =
      Math.min(Number(member.depth) * 18, 180) + "px";

    const name = document.createElement("strong");

    name.textContent =
      member.full_name || "Member";

    const details = document.createElement("div");

    details.className = "small";

    details.textContent =
      "ID: " + (member.member_id || "") +
      " | Position: " +
      (Number(member.depth) === 0
        ? "ROOT"
        : (member.placement_side || ""));

    node.appendChild(name);

    node.appendChild(details);

    tree.appendChild(node);

  });

  message.textContent = "Genealogy updated successfully.";

}


async function logout() {

  const { error } = await client.auth.signOut({
    scope: "local"
  });

  if (error) {

    alert(error.message);

    return;

  }

  showLogin();

  document.getElementById("message").textContent =
    "You have logged out.";

}


async function checkExistingSession() {

  const { data, error } =
    await client.auth.getSession();

  if (error) {

    document.getElementById("message").textContent =
      error.message;

    return;

  }

  if (data.session) {

    showDashboard(data.session.user);

  }

}


client.auth.onAuthStateChange((event, session) => {

  if (event === "SIGNED_IN" && session) {

    showDashboard(session.user);

  }

});

checkExistingSession();

</script>

</body>
</html>
