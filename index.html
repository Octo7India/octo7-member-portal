<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OCTO7 India Member Portal</title>

<style>
:root {
  --navy:#071426;
  --panel:#10243b;
  --gold:#d7b66b;
  --white:#f5f1e8;
  --muted:#b8c4d1;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:linear-gradient(135deg,#06101f,#12304a);
  color:var(--white);
  font:16px Arial;
}

header {
  text-align:center;
  padding:24px;
  border-bottom:1px solid #53657a;
}

header h1 {
  margin:0;
  color:var(--gold);
  letter-spacing:5px;
}

main {
  max-width:1100px;
  margin:22px auto;
  padding:14px;
}

.card {
  background:var(--panel);
  border:1px solid #40556d;
  border-radius:14px;
  padding:18px;
  margin:12px 0;
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:12px;
}

input,select,textarea,button {
  display:block;
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:8px;
  border:1px solid #53657a;
  background:#08192b;
  color:white;
}

button {
  background:var(--gold);
  color:#111;
  font-weight:bold;
  cursor:pointer;
  border:0;
}

.secondary {
  background:#344c66;
  color:white;
}

.hidden {
  display:none;
}

.muted {
  color:var(--muted);
}

.node {
  padding:8px;
  margin:6px;
  border:1px solid #52677e;
  border-radius:8px;
}
</style>
</head>

<body>

<header>
  <h1>OCTO7 INDIA</h1>
  <div>MEMBER & BUSINESS PORTAL</div>
</header>

<main>

<section id="auth">

  <div class="grid">

    <div class="card">
      <h2>Member Login</h2>

      <input id="loginId" placeholder="Member ID">

      <input
        id="loginPassword"
        type="password"
        placeholder="Password"
      >

      <button onclick="login()">LOGIN</button>
    </div>

    <div class="card">
      <h2>Register</h2>

      <input id="fullName" placeholder="Full name">

      <input
        id="email"
        type="email"
        placeholder="Email"
      >

      <input id="phone" placeholder="Phone">

      <input
        id="password"
        type="password"
        placeholder="Password (10+ characters)"
      >

      <select id="positionType">
        <option value="main">Main ID</option>
        <option value="left_child">Left Child ID</option>
        <option value="right_child">Right Child ID</option>
      </select>

      <input
        id="sponsorId"
        placeholder="Sponsor Member ID (optional)"
      >

      <button onclick="registerMember()">
        CREATE MEMBER ID
      </button>
    </div>

  </div>
</section>


<section id="portal" class="hidden">

  <div class="card">

    <button
      class="secondary"
      style="max-width:160px;float:right"
      onclick="logout()"
    >
      LOG OUT
    </button>

    <h2 id="welcome">Member Dashboard</h2>

    <p id="memberInfo" class="muted"></p>

    <div id="profileInfo"></div>

  </div>


  <div class="grid">

    <div class="card">
      <h3>Genealogy</h3>

      <button onclick="tree()">REFRESH TREE</button>

      <div id="treeView"></div>
    </div>


    <div class="card">
      <h3>Products</h3>

      <button onclick="products()">LOAD PRODUCTS</button>

      <div id="productList"></div>
    </div>


    <div class="card">
      <h3>Support</h3>

      <input
        id="ticketTitle"
        placeholder="Subject"
      >

      <textarea
        id="ticketBody"
        placeholder="Message"
      ></textarea>

      <button onclick="support()">SUBMIT TICKET</button>
    </div>

  </div>


  <div class="card">

    <h3>Place a member</h3>

    <input
      id="placeChild"
      placeholder="Member ID to place"
    >

    <input
      id="placeParent"
      placeholder="Parent Member ID"
    >

    <select id="placeSide">
      <option value="left">Left</option>
      <option value="right">Right</option>
    </select>

    <button onclick="place()">SAVE PLACEMENT</button>

  </div>


  <div class="card">

    <h3>Place an order</h3>

    <input
      id="orderProduct"
      type="number"
      placeholder="Product ID"
    >

    <input
      id="orderQty"
      type="number"
      value="1"
      min="1"
    >

    <label>
      <input
        id="couponUse"
        type="checkbox"
        style="display:inline;width:auto"
      >
      Use ₹99.90 coupon redemption
    </label>

    <button onclick="order()">SUBMIT ORDER</button>

  </div>


  <div class="grid">

    <div class="card">
      <h3>Transfer child income to Main ID</h3>

      <input
        id="mainId"
        placeholder="Your Main Member ID"
      >

      <input
        id="transferValue"
        type="number"
        placeholder="Amount (minimum ₹500)"
      >

      <button onclick="transfer()">REQUEST TRANSFER</button>
    </div>


    <div class="card">
      <h3>Bank details</h3>

      <input id="holder" placeholder="Account holder name">

      <input id="bankName" placeholder="Bank name">

      <input id="account" placeholder="Account number">

      <input id="ifsc" placeholder="IFSC">

      <input id="branch" placeholder="Branch">

      <button onclick="bankSave()">SUBMIT BANK DETAILS</button>
    </div>


    <div class="card">
      <h3>Withdrawal</h3>

      <input
        id="bankId"
        type="number"
        placeholder="Verified bank account ID"
      >

      <input
        id="withdrawValue"
        type="number"
        placeholder="Amount (minimum ₹500)"
      >

      <button onclick="withdraw()">REQUEST WITHDRAWAL</button>
    </div>

  </div>

</section>


<div class="card">
  <div id="status" class="muted">
    Welcome to OCTO7 India.
  </div>
</div>

</main>


<script>

// Replace with your Supabase project URL.
const API =
  'https://oqggzpbxrlglsqzdkbpy.supabase.co/functions/v1/octo7-api';

let sessionToken =
  localStorage.getItem('octo7_session') || '';

let current = null;


async function api(action,data={}) {

  const r = await fetch(API,{
    method:'POST',

    headers:{
      'Content-Type':'application/json',

      ...(sessionToken
        ? {Authorization:'Bearer '+sessionToken}
        : {})
    },

    body:JSON.stringify({
      action,
      ...data
    })
  });

  const j = await r.json();

  if(!r.ok) {
    throw Error(j.error || 'Request failed');
  }

  return j;
}


function say(s) {
  document.getElementById('status').textContent = s;
}


// REGISTRATION
async function registerMember() {

  try {

    const r = await api('register_person',{

      full_name:document.getElementById('fullName').value,

      email:document.getElementById('email').value,

      phone:document.getElementById('phone').value,

      password:document.getElementById('password').value,

      position_type:
        document.getElementById('positionType').value,

      sponsor_member_id:
        document.getElementById('sponsorId').value || null

    });

    say(
      'Registration submitted. Your Member ID: ' +
      r.member_id +
      '. Activation is pending.'
    );

  } catch(e) {

    say(e.message);

  }
}


// LOGIN
async function login() {

  try {

    const r = await api('login',{

      member_id:
        document.getElementById('loginId').value,

      password:
        document.getElementById('loginPassword').value

    });

    sessionToken = r.token;

    localStorage.setItem(
      'octo7_session',
      sessionToken
    );

    document.getElementById('auth')
      .classList.add('hidden');

    document.getElementById('portal')
      .classList.remove('hidden');

    await me();

    say('Login successful.');

  } catch(e) {

    say(e.message);

  }
}


// LOGOUT
async function logout() {

  try {
    await api('logout');
  } catch(e) {}

  sessionToken = '';

  localStorage.removeItem('octo7_session');

  document.getElementById('portal')
    .classList.add('hidden');

  document.getElementById('auth')
    .classList.remove('hidden');

  say('Logged out.');

}


// DASHBOARD
async function me() {

  try {

    const r = await api('me');

    current = r;

    document.getElementById('welcome').textContent =
      'Welcome, ' + r.profile.full_name;

    document.getElementById('memberInfo').textContent =
      'Member ID: ' + r.member.member_id +
      ' | Status: ' + r.member.status +
      ' | Position: ' + r.member.position_type;

    document.getElementById('profileInfo').textContent =
      'Wallet balance: ₹' + r.wallet_balance +
      ' | Coupon uses: ' +
      (r.coupon ? r.coupon.used_count + '/10' : 'Not issued');

  } catch(e) {

    say(e.message);

  }
}


// GENEALOGY
async function tree() {

  try {

    const r = await api('my_genealogy');

    document.getElementById('treeView').innerHTML =
      (r.tree || []).map(n =>

        `<div class="node"
          style="margin-left:${Math.min(n.depth,10)*18}px">
          OCTO7 ${n.member_id} — ${n.side || 'Root'}
        </div>`

      ).join('') || 'No placed members';

  } catch(e) {

    say(e.message);

  }
}


// PRODUCTS
async function products() {

  try {

    const r = await api('get_products');

    document.getElementById('productList').innerHTML =
      (r.products || []).map(p =>

        `<div>
          ${p.id}. ${p.name} — ₹${p.price} | ${p.bv} BV
        </div>`

      ).join('') || 'No products available';

  } catch(e) {

    say(e.message);

  }
}


// PLACEMENT
async function place() {

  try {

    await api('place_member',{

      member_id:
        document.getElementById('placeChild').value,

      parent_member_id:
        document.getElementById('placeParent').value,

      side:
        document.getElementById('placeSide').value

    });

    say('Placement saved.');

  } catch(e) {

    say(e.message);

  }
}


// ORDER
async function order() {

  try {

    const r = await api('create_order',{

      items:[{
        product_id:
          Number(document.getElementById('orderProduct').value),

        qty:
          Number(document.getElementById('orderQty').value)
      }],

      use_coupon:
        document.getElementById('couponUse').checked

    });

    say(
      'Order ' +
      r.order.order_no +
      ' submitted for verification.'
    );

  } catch(e) {

    say(e.message);

  }
}


// TRANSFER
async function transfer() {

  try {

    const r = await api('request_transfer',{

      to_member_id:
        document.getElementById('mainId').value,

      amount:
        Number(document.getElementById('transferValue').value)

    });

    say(
      'Transfer request #' +
      r.transfer.id +
      ' submitted.'
    );

  } catch(e) {

    say(e.message);

  }
}


// BANK DETAILS
async function bankSave() {

  try {

    const r = await api('save_bank_account',{

      holder_name:
        document.getElementById('holder').value,

      bank_name:
        document.getElementById('bankName').value,

      account_number:
        document.getElementById('account').value,

      ifsc:
        document.getElementById('ifsc').value,

      branch:
        document.getElementById('branch').value

    });

    say(
      'Bank details submitted. Account ID: ' +
      r.bank_account.id +
      '. Pending verification.'
    );

  } catch(e) {

    say(e.message);

  }
}


// WITHDRAWAL
async function withdraw() {

  try {

    const r = await api('request_withdrawal',{

      bank_id:
        Number(document.getElementById('bankId').value),

      amount:
        Number(document.getElementById('withdrawValue').value)

    });

    say(
      'Withdrawal request #' +
      r.withdrawal.id +
      ' submitted.'
    );

  } catch(e) {

    say(e.message);

  }
}


// SUPPORT
async function support() {

  try {

    const r = await api('create_support_ticket',{

      subject:
        document.getElementById('ticketTitle').value,

      message:
        document.getElementById('ticketBody').value

    });

    say(
      'Support ticket #' +
      r.ticket.id +
      ' created.'
    );

  } catch(e) {

    say(e.message);

  }
}


// RESTORE SESSION
if(sessionToken) {

  document.getElementById('auth')
    .classList.add('hidden');

  document.getElementById('portal')
    .classList.remove('hidden');

  me().catch(logout);

}

</script>

</body>
</html>
