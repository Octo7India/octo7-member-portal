<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCTO7 India | Member Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f8;
  color:#222;
}
header{
  background:#17132d;
  color:white;
  text-align:center;
  padding:25px 12px;
}
header h1{margin:0;color:#fff}
header p{margin:8px 0 0;color:#d6caff}
.container{
  max-width:850px;
  margin:25px auto;
  padding:15px;
}
.card{
  background:white;
  padding:22px;
  margin-bottom:18px;
  border-radius:12px;
  box-shadow:0 3px 12px #00000012;
}
input,button{
  width:100%;
  padding:13px;
  margin:8px 0;
  border-radius:7px;
  font-size:16px;
}
input{border:1px solid #ccc}
button{
  border:0;
  background:#4b258c;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
button.secondary{background:#333}
button:disabled{opacity:.5;cursor:not-allowed}
nav{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:15px;
}
nav button{width:auto;flex:1;min-width:110px}
.hidden{display:none}
#message{white-space:pre-wrap;color:#a32626}
.item{
  padding:12px;
  border-bottom:1px solid #eee;
}
.small{color:#666;font-size:13px}
</style>
</head>

<body>

<header>
  <h1>OCTO7 INDIA</h1>
  <p>MEMBER PORTAL</p>
</header>

<div class="container">

  <section id="loginCard" class="card">
    <h2>Member Login</h2>
    <input id="email" type="email" placeholder="Registered email address">
    <input id="password" type="password" placeholder="Password">
    <button id="loginButton" onclick="login()">MEMBER LOGIN</button>
    <p id="message"></p>
  </section>

  <section id="dashboard" class="hidden">

    <div class="card">
      <h2>Welcome to OCTO7 India</h2>
      <p id="memberInfo">Loading member information...</p>
      <button class="secondary" onclick="logout()">LOG OUT</button>
    </div>

    <nav>
      <button onclick="showPage('home')">Dashboard</button>
      <button onclick="showPage('genealogy')">Genealogy</button>
      <button onclick="showPage('products')">Products</button>
      <button onclick="showPage('orders')">Orders</button>
    </nav>

    <div id="homePage" class="card">
      <h2>Member Dashboard</h2>
      <div id="dashboardData">Loading...</div>
    </div>

    <div id="genealogyPage" class="card hidden">
      <h2>My Genealogy</h2>
      <button onclick="loadGenealogy()">REFRESH GENEALOGY</button>
      <div id="genealogyData"></div>
    </div>

    <div id="productsPage" class="card hidden">
      <h2>Our Products</h2>
      <button onclick="loadProducts()">LOAD PRODUCTS</button>
      <div id="productsData"></div>
    </div>

    <div id="ordersPage" class="card hidden">
      <h2>My Orders</h2>
      <button onclick="loadOrders()">LOAD ORDERS</button>
      <div id="ordersData"></div>
    </div>

  </section>
</div>

<script>
const SUPABASE_URL =
  "https://oqggzpbxrlglsqzdkbpy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_yz9i0uLvJVzElz7IhEMyyw_WQj8hDc0";

const API_URL =
  SUPABASE_URL + "/functions/v1/octo7-api";

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let accessToken = null;

function message(text) {
  document.getElementById("message").textContent = text;
}

async function api(action, extra = {}) {
  if (!accessToken) {
    throw new Error("Please log in again.");
  }

  const response = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + accessToken
    },
    body: JSON.stringify({
      action,
      ...extra
    })
  });

  const result = await response.json();

  if (!response.ok || result.success === false) {
    throw new Error(result.error || "Request failed.");
  }

  return result;
}

async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const button = document.getElementById("loginButton");

  if (!email || !password) {
    message("Enter your registered email and password.");
    return;
  }

  button.disabled = true;
  message("Signing in...");

  try {
    const { data, error } =
      await supabase.auth.signInWithPassword({
        email,
        password
      });

    if (error) throw error;

    accessToken = data.session.access_token;

    const result = await api("me");

    document.getElementById("loginCard").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");

    const member = result.member || {};

    document.getElementById("memberInfo").textContent =
      "Member ID: " + (member.member_id || "—") +
      " | Status: " + (member.status || "—");

    document.getElementById("dashboardData").innerHTML = `
      <div class="item">Left BV: ${result.binary?.left_available_bv ?? "—"}</div>
      <div class="item">Right BV: ${result.binary?.right_available_bv ?? "—"}</div>
      <div class="item">Downline count: ${result.binary?.downline_count ?? "—"}</div>
      <div class="item">Available balance: ₹${result.wallet?.available_balance ?? "—"}</div>
    `;

    message("");
  } catch (error) {
    message(error.message);
    await supabase.auth.signOut();
    accessToken = null;
  } finally {
    button.disabled = false;
  }
}

function showPage(page) {
  ["home", "genealogy", "products", "orders"].forEach(name => {
    document.getElementById(name + "Page")
      .classList.toggle("hidden", name !== page);
  });

  if (page === "genealogy") loadGenealogy();
  if (page === "products") loadProducts();
  if (page === "orders") loadOrders();
}

async function loadGenealogy() {
  const box = document.getElementById("genealogyData");
  box.textContent = "Loading genealogy...";

  try {
    const result = await api("my_genealogy");

    box.innerHTML = "";

    (result.nodes || []).forEach(node => {
      const row = document.createElement("div");
      row.className = "item";
      row.style.paddingLeft = (12 + node.depth * 20) + "px";
      row.textContent =
        "OCTO7 | Member ID: " + node.member_id +
        (node.side ? " | " + node.side : "");
      box.appendChild(row);
    });

    if (!result.nodes?.length) {
      box.textContent = "No genealogy records found.";
    }
  } catch (error) {
    box.textContent = error.message;
  }
}

async function loadProducts() {
  const box = document.getElementById("productsData");
  box.textContent = "Loading products...";

  try {
    const result = await api("get_products");
    box.innerHTML = "";

    (result.products || []).forEach(product => {
      const row = document.createElement("div");
      row.className = "item";
      row.textContent =
        product.name + " | ₹" + product.price +
        " | BV: " + product.bv;
      box.appendChild(row);
    });

    if (!result.products?.length) {
      box.textContent = "No active products found.";
    }
  } catch (error) {
    box.textContent = error.message;
  }
}

async function loadOrders() {
  const box = document.getElementById("ordersData");
  box.textContent = "Loading orders...";

  try {
    const result = await api("orders");
    box.innerHTML = "";

    (result.orders || []).forEach(order => {
      const row = document.createElement("div");
      row.className = "item";
      row.textContent =
        order.order_no + " | " + order.status +
        " | ₹" + order.total;
      box.appendChild(row);
    });

    if (!result.orders?.length) {
      box.textContent = "No orders found.";
    }
  } catch (error) {
    box.textContent = error.message;
  }
}

async function logout() {
  try {
    await supabase.auth.signOut();
  } finally {
    accessToken = null;
    document.getElementById("dashboard").classList.add("hidden");
    document.getElementById("loginCard").classList.remove("hidden");
    document.getElementById("password").value = "";
    message("You have logged out.");
  }
}

async function restoreSession() {
  const { data } = await supabase.auth.getSession();

  if (data.session) {
    accessToken = data.session.access_token;

    try {
      const result = await api("me");

      document.getElementById("loginCard").classList.add("hidden");
      document.getElementById("dashboard").classList.remove("hidden");

      const member = result.member || {};
      document.getElementById("memberInfo").textContent =
        "Member ID: " + (member.member_id || "—") +
        " | Status: " + (member.status || "—");

      document.getElementById("dashboardData").textContent =
        "Your dashboard is ready.";
    } catch (error) {
      accessToken = null;
      await supabase.auth.signOut();
      message(error.message);
    }
  }
}

restoreSession();
</script>

</body>
</html>
